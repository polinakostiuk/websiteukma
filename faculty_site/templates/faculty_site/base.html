<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Факультет НаУКМА{% endblock %}</title>
    <style>
        body{font-family: Arial, sans-serif; margin: 0; padding: 0; background: #ffffff; }
        header { background: #5175d2; color: white; padding: 1rem; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        main { padding: 20px; max-width: 900px; margin: 0 auto; background: white; min-height: 80vh; }
        .card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .open { color: #1a7f37; font-weight: bold; }
        .closed { color: #b42318; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'index' %}">Головна</a>
            <a href="{% url 'department_list' %}">Кафедри</a>
            <a href="{% url 'specialty_list' %}">Спеціальності</a>
            <a href="{% url 'exchange_list' %}">Обмін</a>
        </nav>
    </header>
    <main>
         {% block content %}{% endblock %}
    </main>

</body>
</html>
